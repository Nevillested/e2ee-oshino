# Версия приложения — единственный источник для всех:
#   - Android-клиент (client/android/client-kotlin) собирается с этими versionCode/versionName;
#   - сервер сообщает клиентам versionCode как последнюю версию (GET /app/version): у кого
#     установлена старше — на главном экране кнопка «Обновить приложение»; читает файл при
#     запуске, на сервер он приезжает вместе с server/ при deploy.sh.
# versionCode растёт с каждым выпуском; versionName — 1.0.0, пока идёт закрытое тестирование.
# minVersionCode — самая старая версия, которую сервер ещё обслуживает: клиентам старше неё
# любой запрос отвечает 426. Поднимать только при несовместимых изменениях сервера/протокола.
versionCode=71
versionName=1.0.0
minVersionCode=69
