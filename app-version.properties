# Версия приложения — единственный источник для всех:
#   - Android-клиент (client/android/client-kotlin) собирается с этими versionCode/versionName;
#   - сервер сообщает клиентам versionCode как последнюю версию (GET /app/version): у кого
#     установлена из APK и старше — на главном экране кнопка «Обновить приложение» (установки
#     из Play спрашивают сам Play); читает файл при запуске, на сервер он приезжает вместе
#     с server/ при deploy.sh. Обслуживается любая версия клиента.
# versionCode растёт с каждым выпуском; versionName — 1.0.0, пока идёт закрытое тестирование.
versionCode=73
versionName=1.0.0
