# Проект Xcode генерируется из этого файла: на Mac — `brew install xcodegen`,
# затем `xcodegen` в этой папке → Oshinobu.xcodeproj (сам .xcodeproj в git не кладём).
name: Oshinobu
options:
  bundleIdPrefix: space.oshino
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
packages:
  OshinobuCore:
    path: ../OshinobuCore
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: "120.0.0"
  Lottie:
    url: https://github.com/airbnb/lottie-spm
    from: "4.4.0"
targets:
  Oshinobu:
    type: application
    platform: iOS
    scheme:
      testTargets:
        - OshinobuUITests
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: OshinobuCore
      - package: WebRTC
      - package: Lottie
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Oshinobu
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "10"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [audio, voip, remote-notification, fetch]
        NSMicrophoneUsageDescription: "Oshinobu uses the microphone for calls and voice messages."
        NSCameraUsageDescription: "Oshinobu uses the camera for video calls, photos and video messages."
        NSPhotoLibraryUsageDescription: "Oshinobu needs access to your photos to send them."
        NSPhotoLibraryAddUsageDescription: "Oshinobu saves photos and videos you choose to your library."
        NSFaceIDUsageDescription: "Unlock Oshinobu with Face ID."
        # шифрование — только стандартные алгоритмы (CryptoKit, TLS, DTLS/SRTP в WebRTC): массовое
        # приложение, экспортные документы не нужны (Франция — отдельная декларация, её в App Store
        # не включаем)
        ITSAppUsesNonExemptEncryption: false
        CFBundleLocalizations: [en, ru]
        # шрифты интерфейса — те же, что у Android: Roboto и значки Material Icons
        UIAppFonts: [Roboto.ttf, MaterialIcons-Regular.ttf, MaterialIconsOutlined-Regular.otf]
    settings:
      base:
        # команда Apple Developer (платная, физлицо): подпись, пуши, TestFlight
        DEVELOPMENT_TEAM: JD9PBY7P74
        APP_BUNDLE_ID: space.oshino.oshinobu
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    entitlements:
      path: Sources/Oshinobu.entitlements
      properties:
        aps-environment: development
  # Жесты на настоящем устройстве (удержание записи, панели): XCUITest нажимает как палец.
  OshinobuUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Oshinobu
    settings:
      base:
        DEVELOPMENT_TEAM: JD9PBY7P74
        APP_BUNDLE_ID: space.oshino.oshinobu
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).uitests
        TEST_TARGET_NAME: Oshinobu
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
